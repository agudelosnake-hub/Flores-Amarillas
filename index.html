<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💛 Galaxia de Flores Amarillas 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            width: 100vw;
            font-family: 'Georgia', serif;
            touch-action: none; /* Previene zoom accidental al tocar en móvil */
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 60%, rgba(255, 200, 0, 0.25) 0%, transparent 70%), radial-gradient(ellipse at 50% 50%, rgba(180, 150, 0, 0.15) 0%, transparent 60%), #000;
            z-index: 0;
        }

        #mainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .title {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffd700;
            font-size: 2em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 140, 0, 0.5);
            z-index: 100;
            letter-spacing: 2px;
            padding: 0 10px;
        }

        .floating-flower {
            position: fixed;
            font-size: 60px;
            z-index: 50;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            transition: filter 0.3s, transform 0.3s;
            user-select: none;
            transform: translate(-50%, -50%);
        }

        .floating-flower:hover, .floating-flower:active {
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1));
            transform: translate(-50%, -50%) scale(1.2);
        }

        .floating-flower.small { font-size: 35px; }
        .floating-flower.medium { font-size: 45px; }

        .love-text {
            position: fixed;
            color: #fff;
            font-size: 1.1em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 140, 0, 0.5);
            z-index: 50;
            cursor: pointer;
            white-space: nowrap;
            font-style: italic;
            transition: color 0.3s, transform 0.3s;
            user-select: none;
            transform: translate(-50%, -50%);
        }

        .love-text:hover, .love-text:active {
            color: #ffd700;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active { display: flex; }

        .letter {
            background: linear-gradient(135deg, #fff9e6 0%, #fff5cc 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            border: 3px solid #ffd700;
            animation: slideIn 0.5s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .letter h2 {
            color: #ff8c00;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8em;
        }

        .letter p {
            color: #333;
            line-height: 1.8;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .letter .signature {
            text-align: right;
            color: #ff8c00;
            font-style: italic;
            margin-top: 30px;
            font-size: 1.2em;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            color: #ff8c00;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover { color: #ff4500; }

        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            z-index: 100;
            transition: all 0.3s;
        }

        .music-btn:hover, .music-btn:active { 
            background: rgba(255, 215, 0, 0.4); 
        }

        /* ==========================================
           📱 AJUSTES ESPECÍFICOS PARA MÓVIL
           ========================================== */
        @media (max-width: 768px) {
            .title { 
                font-size: 1.4em; 
                top: 10px;
                letter-spacing: 1px;
                padding: 0 80px 0 10px; /* Espacio para que no se tape con el botón de música */
            }
            
            .music-btn {
                top: 10px;
                right: 10px;
                padding: 8px 14px;
                font-size: 0.85em;
                border-radius: 20px;
            }
            
            .floating-flower { font-size: 45px; }
            .floating-flower.small { font-size: 28px; }
            .floating-flower.medium { font-size: 35px; }
            
            .love-text { font-size: 0.95em; }
            
            .letter {
                padding: 25px;
                width: 92%;
            }
            
            .letter h2 { font-size: 1.5em; }
            .letter p { font-size: 1em; }
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 400px) {
            .title { font-size: 1.2em; }
            .floating-flower { font-size: 40px; }
            .floating-flower.small { font-size: 25px; }
            .floating-flower.medium { font-size: 30px; }
            .love-text { font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="stars" id="stars"></div>
    <canvas id="mainCanvas"></canvas>

    <h1 class="title">Galaxia de Flores Amarillas</h1>
    <button class="music-btn" onclick="toggleMusic()">🎵 Música</button>

    <div class="floating-flower" onclick="showLetter(1)">🌻</div>
    <div class="floating-flower medium" onclick="showLetter(2)">💐</div>
    <div class="floating-flower small" onclick="showLetter(3)">🌼</div>
    <div class="floating-flower" onclick="showLetter(4)">🌻</div>
    <div class="floating-flower medium" onclick="showLetter(5)">💐</div>
    <div class="floating-flower small" onclick="showLetter(6)">🌻</div>
    <div class="floating-flower small" onclick="showLetter(7)">🌼</div>
    <div class="floating-flower small" onclick="showLetter(8)">🌻</div>

    <div class="love-text" onclick="showLetter(1)">Eres Mi Sol 💛</div>
    <div class="love-text" onclick="showLetter(2)">Te Adoro 💕</div>
    <div class="love-text" onclick="showLetter(3)">Karolina 🤎</div>
    <div class="love-text" onclick="showLetter(4)">Mi Amor </div>
    <div class="love-text" onclick="showLetter(5)">Me Encantas </div>
    <div class="love-text" onclick="showLetter(6)">Amor De Mi Vida </div>
    <div class="love-text" onclick="showLetter(7)">Mi Amorsito 💛</div>
    <div class="love-text" onclick="showLetter(8)">Siempre juntos </div>

    <div class="modal" id="letterModal">
        <div class="letter">
            <span class="close-btn" onclick="closeLetter()">&times;</span>
            <h2 id="letterTitle"></h2>
            <p id="letterContent"></p>
            <div class="signature" id="letterSignature"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundjay.com/free-music/mp3/soft-calm-piano-background-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let W, H, centerX, centerY;
        let heartParticles = [];
        let galaxyParticles = [];
        let floatingParticles = [];
        let shootingStars = [];
        let time = 0;
        let heartRotationAngle = 0;
        let lastShootingStarTime = 0;

        const romanticPhrase = ["Quiero", "Ser", "El", "Unico", "Que", "Muerda", "Tu", "Boca"];
        let currentWordIndex = 0;
        let phraseComplete = false;
        let pauseTimer = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H * 0.38;
            initParticles();
        }

        function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
        function heartY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); }

        function initParticles() {
            heartParticles = [];
            galaxyParticles = [];
            floatingParticles = [];

            const heartScale = Math.min(W, H) * 0.24;
            const numHeartParticles = 1800;

            for (let i = 0; i < numHeartParticles; i++) {
                const t = Math.random() * Math.PI * 2;
                const hx = heartX(t);
                const hy = heartY(t);

                const isOutline = Math.random() > 0.4;
                const dispersion = isOutline ? (Math.random() - 0.5) * 3 : (Math.random() - 0.5) * (heartScale * 0.6);

                const colorVar = Math.random();
                let r = 255, g = 215, b = 0;
                if (colorVar > 0.85) { r = 255; g = 250; b = 205; }
                else if (colorVar > 0.5) { r = 255; g = 180; b = 0; }

                heartParticles.push({
                    baseX: hx * heartScale / 16 + dispersion,
                    baseY: hy * heartScale / 16 + dispersion,
                    size: isOutline ? Math.random() * 2.2 + 1.0 : Math.random() * 1.5 + 0.5,
                    alpha: isOutline ? Math.random() * 0.5 + 0.5 : Math.random() * 0.3 + 0.1,
                    phase: Math.random() * Math.PI * 2,
                    z: Math.random() * 2 - 1,
                    r: r, g: g, b: b,
                    isOutline: isOutline
                });
            }

            const galaxyCenterY = centerY + heartScale * 0.5;
            const numGalaxyParticles = 3500;

            for (let i = 0; i < numGalaxyParticles; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * heartScale * 2.8;
                const spiralAngle = angle + radius * 0.008;

                galaxyParticles.push({
                    angle: spiralAngle,
                    radius: radius,
                    size: Math.random() * 2.2 + 0.4,
                    alpha: Math.random() * 0.7 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    centerX: centerX,
                    centerY: galaxyCenterY
                });
            }

            const numFloating = 500;
            for (let i = 0; i < numFloating; i++) {
                floatingParticles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 3 + 1,
                    alpha: Math.random() * 0.6 + 0.1,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3 - 0.2,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function createShootingStar() {
            const now = Date.now();

            if (phraseComplete) {
                pauseTimer += 16;
                if (pauseTimer > 6000) {
                    currentWordIndex = 0;
                    phraseComplete = false;
                    pauseTimer = 0;
                }
                return;
            }

            if (now - lastShootingStarTime > 2000 + Math.random() * 1000) {
                const word = romanticPhrase[currentWordIndex];
                const direction = Math.floor(Math.random() * 4);
                let startX, startY, vx, vy;

                switch (direction) {
                    case 0:
                        startX = Math.random() * W * 0.3;
                        startY = Math.random() * H * 0.3;
                        vx = 10 + Math.random() * 5;
                        vy = 6 + Math.random() * 3;
                        break;
                    case 1:
                        startX = W - Math.random() * W * 0.3;
                        startY = Math.random() * H * 0.3;
                        vx = -(10 + Math.random() * 5);
                        vy = 6 + Math.random() * 3;
                        break;
                    case 2:
                        startX = W * 0.2 + Math.random() * W * 0.6;
                        startY = Math.random() * H * 0.2;
                        vx = (Math.random() - 0.5) * 4;
                        vy = 12 + Math.random() * 4;
                        break;
                    case 3:
                        startX = Math.random() * W * 0.3;
                        startY = H - Math.random() * H * 0.3;
                        vx = 10 + Math.random() * 5;
                        vy = -(6 + Math.random() * 3);
                        break;
                }

                shootingStars.push({
                    x: startX, y: startY, vx: vx, vy: vy,
                    length: 80 + Math.random() * 60,
                    life: 1.0, decay: 0.012 + Math.random() * 0.008,
                    word: word, wordX: 0, wordY: 0, wordLife: 0,
                    trail: [], direction: direction
                });

                currentWordIndex++;
                if (currentWordIndex >= romanticPhrase.length) {
                    phraseComplete = true;
                    pauseTimer = 0;
                }
                lastShootingStarTime = now;
            }
        }

        function updateAndDrawShootingStars() {
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const star = shootingStars[i];
                star.x += star.vx;
                star.y += star.vy;
                star.life -= star.decay;

                star.trail.push({ x: star.x, y: star.y });
                if (star.trail.length > 25) star.trail.shift();

                if (star.trail.length > 1) {
                    for (let j = 0; j < star.trail.length - 1; j++) {
                        const point = star.trail[j];
                        const nextPoint = star.trail[j + 1];
                        const alpha = (j / star.trail.length) * star.life * 0.9;

                        ctx.strokeStyle = `rgba(255, 255, 220, ${alpha})`;
                        ctx.lineWidth = (j / star.trail.length) * 3.5;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(point.x, point.y);
                        ctx.lineTo(nextPoint.x, nextPoint.y);
                        ctx.stroke();

                        if (j % 2 === 0) {
                            ctx.fillStyle = `rgba(255, 215, 0, ${alpha * 0.6})`;
                            ctx.beginPath();
                            ctx.arc(point.x, point.y, (j / star.trail.length) * 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                if (star.life > 0.3) {
                    const headGlow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, 8);
                    headGlow.addColorStop(0, `rgba(255, 255, 255, ${star.life})`);
                    headGlow.addColorStop(0.5, `rgba(255, 255, 200, ${star.life * 0.7})`);
                    headGlow.addColorStop(1, 'rgba(255, 215, 0, 0)');
                    ctx.fillStyle = headGlow;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (star.wordLife === 0 && star.life < 0.75) {
                    const offset = 40;
                    if (star.direction === 0) { star.wordX = star.x - 50; star.wordY = star.y + offset; }
                    else if (star.direction === 1) { star.wordX = star.x + 10; star.wordY = star.y + offset; }
                    else if (star.direction === 2) { star.wordX = star.x - 40; star.wordY = star.y + offset; }
                    else { star.wordX = star.x - 50; star.wordY = star.y - offset; }
                    star.wordLife = 1.0;
                }

                if (star.wordLife > 0) {
                    star.wordLife -= 0.006;
                    if (star.wordLife > 0) {
                        ctx.save();
                        const appearEffect = Math.min((1 - star.wordLife) * 5, 1);
                        const currentAlpha = star.wordLife * 0.95 * appearEffect;

                        ctx.font = 'italic bold 28px Georgia';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = `rgba(216, 180, 254, ${currentAlpha})`;
                        ctx.shadowColor = `rgba(168, 85, 247, ${currentAlpha})`;
                        ctx.shadowBlur = 30 * star.wordLife;
                        ctx.fillText(star.word, star.wordX, star.wordY);

                        ctx.font = 'italic bold 30px Georgia';
                        ctx.fillStyle = `rgba(192, 132, 252, ${currentAlpha * 0.5})`;
                        ctx.shadowBlur = 50 * star.wordLife;
                        ctx.fillText(star.word, star.wordX, star.wordY);

                        ctx.font = 'italic bold 26px Georgia';
                        ctx.fillStyle = `rgba(240, 220, 255, ${currentAlpha * 0.7})`;
                        ctx.shadowBlur = 15 * star.wordLife;
                        ctx.fillText(star.word, star.wordX, star.wordY);
                        ctx.restore();
                    }
                }

                const outOfBounds = star.x < -100 || star.x > W + 100 || star.y < -100 || star.y > H + 100;
                if ((star.life <= 0 && star.wordLife <= 0) || outOfBounds) {
                    shootingStars.splice(i, 1);
                }
            }
        }

        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function drawBloomingFlower(x, y, progress, scale, isLeft) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            if (progress > 0.0) {
                const rootProgress = Math.min(progress / 0.35, 1);
                const easedRoot = easeOutBack(rootProgress);
                const maxRootDepth = 70;
                const currentRootDepth = maxRootDepth * easedRoot;

                if (rootProgress > 0.1) {
                    const glowSize = 25 * easedRoot;
                    const glowPulse = 1 + Math.sin(time * 6) * 0.3;
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize * glowPulse);
                    gradient.addColorStop(0, `rgba(255, 215, 0, ${0.6 * easedRoot})`);
                    gradient.addColorStop(0.5, `rgba(255, 180, 0, ${0.3 * easedRoot})`);
                    gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowSize * glowPulse, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (rootProgress > 0.15 && rootProgress < 0.95) {
                    for (let i = 0; i < 8; i++) {
                        const pTime = (time * 4 + i * 0.4) % 1;
                        const px = Math.sin(pTime * Math.PI * 2 + i) * 6;
                        const py = currentRootDepth * pTime;
                        const pSize = (1 - pTime) * 3.5;
                        const pAlpha = (1 - pTime) * 0.9;
                        ctx.fillStyle = `rgba(255, 255, 200, ${pAlpha})`;
                        ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
                        ctx.shadowBlur = 5;
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const mainRootWobble = Math.sin(time * 2) * 3;
                ctx.strokeStyle = '#4a2c0a';
                ctx.lineWidth = 4 * easedRoot;
                ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                ctx.shadowBlur = 8 * easedRoot;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(mainRootWobble, currentRootDepth * 0.5, mainRootWobble * 0.5, currentRootDepth);
                ctx.stroke();

                if (rootProgress > 0.4) {
                    const subProgress1 = (rootProgress - 0.4) / 0.6;
                    const easedSub1 = easeOutBack(subProgress1);
                    const subDepth1 = currentRootDepth * 0.6 * easedSub1;
                    const startX1 = mainRootWobble * 0.25;
                    const startY1 = currentRootDepth * 0.4;
                    ctx.lineWidth = 2.5 * easedSub1;
                    ctx.beginPath();
                    ctx.moveTo(startX1, startY1);
                    ctx.quadraticCurveTo(startX1 - 20 * easedSub1, startY1 + subDepth1 * 0.5, startX1 - 25 * easedSub1, startY1 + subDepth1);
                    ctx.stroke();
                }
                if (rootProgress > 0.5) {
                    const subProgress2 = (rootProgress - 0.5) / 0.5;
                    const easedSub2 = easeOutBack(subProgress2);
                    const subDepth2 = currentRootDepth * 0.7 * easedSub2;
                    const startX2 = mainRootWobble * 0.25;
                    const startY2 = currentRootDepth * 0.55;
                    ctx.lineWidth = 2.5 * easedSub2;
                    ctx.beginPath();
                    ctx.moveTo(startX2, startY2);
                    ctx.quadraticCurveTo(startX2 + 18 * easedSub2, startY2 + subDepth2 * 0.5, startX2 + 22 * easedSub2, startY2 + subDepth2);
                    ctx.stroke();
                }
                if (rootProgress > 0.6) {
                    const subProgress3 = (rootProgress - 0.6) / 0.4;
                    const easedSub3 = easeOutBack(subProgress3);
                    const subDepth3 = currentRootDepth * 0.5 * easedSub3;
                    const startX3 = mainRootWobble * 0.4;
                    const startY3 = currentRootDepth * 0.75;
                    ctx.lineWidth = 1.5 * easedSub3;
                    ctx.beginPath();
                    ctx.moveTo(startX3, startY3);
                    ctx.quadraticCurveTo(startX3 + 10 * easedSub3, startY3 + subDepth3 * 0.5, startX3 + 12 * easedSub3, startY3 + subDepth3);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;

                if (rootProgress > 0.8) {
                    const tipGlow = (rootProgress - 0.8) / 0.2;
                    const pulse = 1 + Math.sin(time * 5) * 0.2;
                    const tipX = mainRootWobble * 0.5;
                    const tipY = currentRootDepth;
                    const g1 = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 12 * pulse);
                    g1.addColorStop(0, `rgba(255, 255, 220, ${0.9 * tipGlow})`);
                    g1.addColorStop(1, 'rgba(255, 215, 0, 0)');
                    ctx.fillStyle = g1;
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 12 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const stemHeight = 120;
            const rawStemProgress = Math.min(progress / 0.4, 1);
            const easedStemProgress = easeOutBack(rawStemProgress);
            const currentStemHeight = stemHeight * easedStemProgress;

            if (progress > 0.02) {
                const stemTopY = -currentStemHeight;
                const windFreq = time * 5;
                const windBend = Math.sin(windFreq + (isLeft ? 0 : 2)) * 15 * easedStemProgress;
                const stemGradient = ctx.createLinearGradient(0, 0, windBend * 0.5, stemTopY);
                stemGradient.addColorStop(0, '#2d5016');
                stemGradient.addColorStop(0.5, '#4a7c2e');
                stemGradient.addColorStop(1, '#6ba83a');

                ctx.strokeStyle = stemGradient;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(windBend, stemTopY / 2, windBend * 0.5, stemTopY);
                ctx.stroke();

                if (progress > 0.15) {
                    const rawLeafProgress = Math.min((progress - 0.15) / 0.25, 1);
                    const leafProgress = easeOutBack(rawLeafProgress);
                    const leafSize = 25 * leafProgress;
                    const currentStemMid = stemTopY * 0.6;
                    const currentWind = windBend * 0.6;

                    ctx.save();
                    ctx.translate(currentWind - 2, currentStemMid);
                    ctx.rotate(-0.8 + (leafProgress * 0.5) + Math.sin(time * 6) * 0.15);
                    ctx.fillStyle = '#4a7c2e';
                    ctx.beginPath();
                    ctx.ellipse(-leafSize / 2, 0, leafSize, leafSize * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#2d5016';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-leafSize / 2, -5, -leafSize, 0);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(currentWind + 2, currentStemMid + 25);
                    ctx.rotate(0.8 - (leafProgress * 0.5) + Math.sin(time * 6 + 1) * 0.15);
                    ctx.fillStyle = '#5a8c3e';
                    ctx.beginPath();
                    ctx.ellipse(leafSize / 2, 0, leafSize, leafSize * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#2d5016';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(leafSize / 2, -5, leafSize, 0);
                    ctx.stroke();
                    ctx.restore();
                }

                if (progress > 0.35) {
                    const rawFlowerProgress = Math.min((progress - 0.35) / 0.65, 1);
                    const flowerY = stemTopY;
                    const currentWindTop = windBend * 0.5;

                    if (rawFlowerProgress < 0.3) {
                        const budScale = rawFlowerProgress / 0.3;
                        ctx.save();
                        ctx.translate(currentWindTop + Math.sin(time * 15) * 0.1 * rawFlowerProgress, flowerY);
                        ctx.scale(budScale, budScale);
                        ctx.fillStyle = '#8ba84a';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#6b8830';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(-5, -8);
                        ctx.quadraticCurveTo(0, -14, 5, -8);
                        ctx.stroke();
                        ctx.restore();
                    } else {
                        const bloomRaw = (rawFlowerProgress - 0.3) / 0.7;
                        const bloomProgress = easeOutBack(bloomRaw);
                        ctx.save();
                        ctx.translate(currentWindTop, flowerY);
                        ctx.rotate(Math.sin(time * 4 + (isLeft ? 0 : 3)) * 0.25 * bloomProgress);

                        const petalCount = 14;
                        const maxPetalLength = 24;
                        const petalLength = maxPetalLength * bloomProgress;
                        const petalWidth = 9 * bloomProgress;
                        const petalPulse = 1 + Math.sin(time * 5) * 0.05;

                        for (let i = 0; i < petalCount; i++) {
                            const angle = (i / petalCount) * Math.PI * 2;
                            const petalReach = petalLength * (0.5 + bloomProgress * 0.5) * petalPulse;
                            ctx.save();
                            ctx.rotate(angle);
                            const petalGradient = ctx.createLinearGradient(0, 0, 0, -petalReach);
                            petalGradient.addColorStop(0, '#FFB400');
                            petalGradient.addColorStop(0.5, '#FFD700');
                            petalGradient.addColorStop(1, '#FFF080');
                            ctx.fillStyle = petalGradient;
                            ctx.beginPath();
                            ctx.ellipse(0, -petalReach * 0.6, petalWidth, petalReach * 0.6, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(255, 180, 0, 0.6)';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                            ctx.restore();
                        }

                        const centerSize = 13 * bloomProgress;
                        const centerGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, centerSize);
                        centerGradient.addColorStop(0, '#4a2c0a');
                        centerGradient.addColorStop(0.6, '#6b3f15');
                        centerGradient.addColorStop(1, '#8b5a2b');
                        ctx.fillStyle = centerGradient;
                        ctx.beginPath();
                        ctx.arc(0, 0, centerSize, 0, Math.PI * 2);
                        ctx.fill();

                        if (bloomProgress > 0.5) {
                            const seedOpacity = Math.min((bloomProgress - 0.5) * 2, 1);
                            ctx.fillStyle = `rgba(139, 90, 43, ${seedOpacity})`;
                            for (let i = 0; i < 20; i++) {
                                const seedAngle = (i / 20) * Math.PI * 2;
                                const seedRadius = centerSize * 0.6;
                                ctx.beginPath();
                                ctx.arc(Math.cos(seedAngle) * seedRadius, Math.sin(seedAngle) * seedRadius, 1.2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            for (let i = 0; i < 12; i++) {
                                const seedAngle = (i / 12) * Math.PI * 2;
                                const seedRadius = centerSize * 0.3;
                                ctx.beginPath();
                                ctx.arc(Math.cos(seedAngle) * seedRadius, Math.sin(seedAngle) * seedRadius, 1, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }

                        const centerShine = ctx.createRadialGradient(-centerSize * 0.3, -centerSize * 0.3, 0, 0, 0, centerSize);
                        centerShine.addColorStop(0, 'rgba(255, 240, 180, 0.5)');
                        centerShine.addColorStop(1, 'rgba(255, 240, 180, 0)');
                        ctx.fillStyle = centerShine;
                        ctx.beginPath();
                        ctx.arc(0, 0, centerSize, 0, Math.PI * 2);
                        ctx.fill();

                        if (bloomProgress > 0.4) {
                            const sparkleIntensity = Math.min((bloomProgress - 0.4) / 0.6, 1);
                            for (let i = 0; i < 20; i++) {
                                const orbitAngle = (i / 20) * Math.PI * 2 + time * 5;
                                const orbitRadius = (maxPetalLength * 1.4) + Math.sin(time * 4 + i * 1.5) * 12;
                                const sx = Math.cos(orbitAngle) * orbitRadius;
                                const sy = Math.sin(orbitAngle) * orbitRadius * 0.7;
                                const twinkle = (Math.sin(time * 12 + i * 2.5) + 1) / 2;

                                if (twinkle > 0.3) {
                                    const sparkleSize = (2 + Math.sin(time * 8 + i) * 0.8) * twinkle;
                                    ctx.fillStyle = `rgba(255, 255, 220, ${twinkle * sparkleIntensity * 0.9})`;
                                    ctx.beginPath();
                                    ctx.arc(sx, sy, sparkleSize, 0, Math.PI * 2);
                                    ctx.fill();
                                    ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * sparkleIntensity * 0.5})`;
                                    ctx.beginPath();
                                    ctx.arc(sx, sy, sparkleSize * 3, 0, Math.PI * 2);
                                    ctx.fill();
                                }
                            }
                        }
                        ctx.restore();
                    }
                }
            }
            ctx.restore();
        }

        function drawHeart() {
            heartRotationAngle += 0.012;
            const globalPulse = 1 + Math.sin(time * 1.5) * 0.03;
            const cosRotation = Math.cos(heartRotationAngle);
            const sinRotation = Math.sin(heartRotationAngle);

            for (const p of heartParticles) {
                const rotatedX = p.baseX * cosRotation * globalPulse;
                const scaleZ = p.z * sinRotation * 0.3 * globalPulse;
                const finalX = centerX + rotatedX + scaleZ;
                const finalY = centerY + p.baseY * globalPulse;
                const depthScale = 1 + p.z * sinRotation * 0.2;
                const finalSize = p.size * depthScale * globalPulse;
                const shimmer = Math.sin(time * 2.5 + p.phase) * 0.2 + 0.8;
                const alpha = p.alpha * shimmer * (0.5 + depthScale * 0.5);

                ctx.beginPath();
                ctx.arc(finalX, finalY, finalSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;
                ctx.fill();

                if (p.isOutline && alpha > 0.65) {
                    ctx.beginPath();
                    ctx.arc(finalX, finalY, finalSize * 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.15})`;
                    ctx.fill();
                }
            }

            ctx.save();
            ctx.font = `bold ${Math.min(W, H) * 0.05}px Georgia`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.9)';
            ctx.shadowBlur = 25;
            ctx.fillText('Karolina 🤎', centerX, centerY - 10);
            ctx.restore();
        }

        function drawBloomingFlowers() {
            const heartScale = Math.min(W, H) * 0.24;
            
            // 📱 AJUSTE MÓVIL: Separación y escala adaptativa
            const isMobile = W < 768;
            const separationFactor = isMobile ? 1.5 : 1.9;
            const verticalFactor = isMobile ? 1.5 : 1.9;
            const flowerScale = isMobile ? Math.min(W, H) * 0.0014 : Math.min(W, H) * 0.0018;
            
            const leftX = centerX - heartScale * separationFactor;
            const rightX = centerX + heartScale * separationFactor;
            const flowerY = centerY + heartScale * verticalFactor;
            
            const cycleDuration = 4.0;
            const cycleTime = time % cycleDuration;
            
            let mainProgress;
            if (cycleTime < cycleDuration * 0.6) mainProgress = cycleTime / (cycleDuration * 0.6);
            else if (cycleTime < cycleDuration * 0.85) mainProgress = 1;
            else mainProgress = 1 - (cycleTime - cycleDuration * 0.85) / (cycleDuration * 0.15);
            
            const leftProgress = Math.max(0, Math.min(1, mainProgress));
            drawBloomingFlower(leftX, flowerY, leftProgress, flowerScale, true);
            
            const rightCycleTime = (time + cycleDuration / 2) % cycleDuration;
            let rightProgress;
            if (rightCycleTime < cycleDuration * 0.6) rightProgress = rightCycleTime / (cycleDuration * 0.6);
            else if (rightCycleTime < cycleDuration * 0.85) rightProgress = 1;
            else rightProgress = 1 - (rightCycleTime - cycleDuration * 0.85) / (cycleDuration * 0.15);
            
            rightProgress = Math.max(0, Math.min(1, rightProgress));
            drawBloomingFlower(rightX, flowerY, rightProgress, flowerScale, false);
        }

        function drawGalaxy() {
            const rotationSpeed = 0.00015;
            for (const p of galaxyParticles) {
                p.angle += rotationSpeed;
                const x = p.centerX + Math.cos(p.angle) * p.radius;
                const y = p.centerY + Math.sin(p.angle) * p.radius * 0.4;
                const shimmer = Math.sin(time * 2 + p.phase) * 0.3 + 0.7;
                const alpha = p.alpha * shimmer;
                const distRatio = p.radius / (Math.min(W, H) * 0.24 * 2.8);
                const brightness = 1 - distRatio * 0.7;

                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.floor(255 * brightness)}, ${Math.floor(215 * brightness)}, 0, ${alpha})`;
                ctx.fill();
            }

            const galaxyCenterY = centerY + Math.min(W, H) * 0.24 * 0.5;
            const gradient = ctx.createRadialGradient(centerX, galaxyCenterY, 0, centerX, galaxyCenterY, 100);
            gradient.addColorStop(0, 'rgba(255, 255, 220, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 215, 0, 0.5)');
            gradient.addColorStop(0.5, 'rgba(255, 180, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, galaxyCenterY, 100, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawFloatingParticles() {
            for (const p of floatingParticles) {
                p.x += p.vx;
                p.y += p.vy;
                p.phase += 0.02;
                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H;
                if (p.y > H) p.y = 0;

                const shimmer = Math.sin(p.phase) * 0.3 + 0.7;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha * shimmer})`;
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);
            time += 0.016;
            createShootingStar();
            updateAndDrawShootingStars();
            drawFloatingParticles();
            drawGalaxy();
            drawHeart();
            drawBloomingFlowers();
            requestAnimationFrame(animate);
        }

        const orbitElements = [];
        function initOrbits() {
            orbitElements.length = 0;
            const flowers = document.querySelectorAll('.floating-flower');
            const texts = document.querySelectorAll('.love-text');
            const allElements = [...flowers, ...texts];

            const orbitConfigs = [
                { rx: 0.22, ry: 0.18, speed: 0.012 }, { rx: 0.28, ry: 0.23, speed: -0.010 },
                { rx: 0.34, ry: 0.28, speed: 0.009 }, { rx: 0.40, ry: 0.33, speed: -0.008 },
                { rx: 0.46, ry: 0.38, speed: 0.007 }, { rx: 0.52, ry: 0.43, speed: -0.006 },
                { rx: 0.25, ry: 0.20, speed: 0.011 }, { rx: 0.31, ry: 0.26, speed: -0.009 },
                { rx: 0.37, ry: 0.31, speed: 0.008 }, { rx: 0.43, ry: 0.36, speed: -0.007 },
                { rx: 0.49, ry: 0.41, speed: 0.006 }, { rx: 0.55, ry: 0.46, speed: -0.005 },
                { rx: 0.20, ry: 0.16, speed: 0.013 }, { rx: 0.35, ry: 0.29, speed: -0.008 },
                { rx: 0.45, ry: 0.37, speed: 0.007 }, { rx: 0.58, ry: 0.48, speed: -0.004 }
            ];

            allElements.forEach((el, i) => {
                const cfg = orbitConfigs[i % orbitConfigs.length];
                orbitElements.push({
                    el: el, rx: cfg.rx * Math.min(W, H), ry: cfg.ry * Math.min(W, H),
                    speed: cfg.speed, angle: (i / allElements.length) * Math.PI * 2,
                    centerX: centerX, centerY: centerY
                });
            });
        }

        function updateOrbits() {
            for (const item of orbitElements) {
                item.angle += item.speed;
                const x = item.centerX + Math.cos(item.angle) * item.rx;
                const y = item.centerY + Math.sin(item.angle) * item.ry;
                item.el.style.left = x + 'px';
                item.el.style.top = y + 'px';
                item.el.style.transform = `translate(-50%, -50%)`;
            }
            requestAnimationFrame(updateOrbits);
        }

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 400; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                starsContainer.appendChild(star);
            }
        }

        const letters = {
            1: { title: "Eres Mi Sol 💛", content: "Como El Sol Que Da Vida A Las Flores Amarillas, Tú Das Sentido A Mi Existencia. Tu Amor Me Hace Crecer, Me Hace Fuerte, Me Hace Feliz Cada Día.", signature: "Para Siempre Juntos " },
            2: { title: "Te Adoro 💕", content: "En Este Día De Las Flores Amarillas, Quiero Que Sepas Que Eres La Luz Que Ilumina Mi Universo. Como Estas Flores Que Brillan En El Espacio, Mi Amor Por Ti Es Infinito.", signature: "Con Todo Mi Amor 💛" },
            3: { title: "Karolina 🤎", content: "Eres La Razón De Cada Una De Mis Sonrisas. Como Estas Flores Que Giran A Tu Alrededor, Mi Mundo Gira En Torno A Ti. Te Amo Con Todo Mi Corazón.", signature: "Eternamente Tuyo " },
            4: { title: "Mi Amor 💛", content: "Prometo Estar Contigo En Cada Amanecer Y Cada Atardecer, Reír Contigo En Los Buenos Momentos Y Sostenerte En Los Difíciles. Eres Mi Persona Favorita.", signature: "Siempre Tuyo ✨" },
            5: { title: "Me Encantas 🌻", content: "Gracias Por Ser Quien Eres, Por Tu Sonrisa Que Me Alegra El Día, Por Tu Amor Que Me Da Fuerza. Cada Momento Contigo Es Un Regalo Que Atesoro.", signature: "Con Amor Eterno " },
            6: { title: "Mi Amorsito 💕", content: "Contigo Descubrí Que El Amor Verdadero Existe, Que Las Estrellas Brillan Más Cuando Estamos Juntos, Y Que La Felicidad Es Tenerte A Mi Lado.", signature: "Mi Todo 💕" },
            7: { title: "Amor De Mi Vida 💛", content: "Podría Darte Mil Razones Por Las Que Te Amo, Pero Solo Necesito Una: Eres Tú. Tú Eres Suficiente Para Hacer De Mi Vida Algo Maravilloso.", signature: "Con Amor Infinito 💛" },
            8: { title: "Siempre Juntos 💛", content: "El Mejor Regalo Que La Vida Me Ha Dado Es Conocerte. Cada Día A Tu Lado Es Un 21 De Septiembre Eterno, Lleno De Flores Amarillas Y Amor Verdadero.", signature: "Te Quiero 💕" }
        };

        function showLetter(num) {
            const modal = document.getElementById('letterModal');
            const letter = letters[num];
            document.getElementById('letterTitle').textContent = letter.title;
            document.getElementById('letterContent').textContent = letter.content;
            document.getElementById('letterSignature').textContent = letter.signature;
            modal.classList.add('active');
        }

        function closeLetter() {
            document.getElementById('letterModal').classList.remove('active');
        }

        document.getElementById('letterModal').addEventListener('click', function (e) {
            if (e.target === this) closeLetter();
        });

        let musicPlaying = false;
        const bgMusic = document.getElementById('bgMusic');

        function toggleMusic() {
            const btn = document.querySelector('.music-btn');
            if (musicPlaying) {
                bgMusic.pause();
                btn.textContent = '🎵 Música';
                musicPlaying = false;
            } else {
                bgMusic.play().catch(e => console.log('Audio no disponible'));
                btn.textContent = '🔇 Pausar';
                musicPlaying = true;
            }
        }

        window.addEventListener('resize', () => {
            resize();
            initOrbits();
        });

        resize();
        createStars();
        initOrbits();
        updateOrbits();
        animate();
    </script>
